name: trading-bot

on:
  push:
    paths: ["trading-bot/**", ".github/workflows/trading-bot.yml"]
  pull_request:
    paths: ["trading-bot/**", ".github/workflows/trading-bot.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-bot/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Validar config
        run: freqtrade show-config -c user_data/config.json --userdir user_data > /dev/null
