services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creator}
      POSTGRES_DB: ${POSTGRES_DB:-creator_hub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creator} -d ${POSTGRES_DB:-creator_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-creator}:${POSTGRES_PASSWORD:-creator}@postgres:5432/${POSTGRES_DB:-creator_hub}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      MEDIA_ROOT: /data/media
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  media_data:
